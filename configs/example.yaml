# Glob pattern for the WebDataset record shards used for training.
records_pattern: "webdataset_EuclidDR1F/EuclidDR1F_grid_dmb_*.tar"
config_forward_model: "config_msfm_EuclidDR1F_onthefly.yaml"

# Training settings shared by every sweep element.
sweep:
  - sweep_tag: default
    model_name: "nested_transformer"
    model_args:
      base_embed_dim: 128
      growth: "128"
    loss_function: "mse"
    learning_rate: 0.00001
  - sweep_tag: vimm
    model_name: "nested_transformer"
    model_args:
      base_embed_dim: 64
      growth: "128"
    loss_function: "vimm_gmm"
    loss_args:
      hidden_dim: 128
    learning_rate: 0.00001
num_epochs: 1
batch_size: 16
num_workers: 8
max_steps: 100
validation_fraction: 0.1
seed: 42
device: "cuda"

# Model architecture settings.
in_channels: 3
num_targets: 1
hidden_channels: 64
num_blocks: 4
dropout: 0.1

# Checkpointing settings.
checkpoint_dir: "checkpoints"
checkpoint_every_steps: 1000
resume_from_checkpoint: null

# Weights & Biases logging settings.
wandb_project: "euclid-multiprobe-deeplss-training"
wandb_run_name: "example-run"
wandb_mode: "offline"
