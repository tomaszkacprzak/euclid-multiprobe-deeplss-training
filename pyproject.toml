[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euclid-multiprobe-deeplss-training"
version = "0.1.0"
description = "Euclid multiprobe DeepLSS pipeline training of neural networks."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Euclid Multiprobe DeepLSS Training Contributors" }
]
keywords = ["euclid", "deeplss", "cosmology", "machine-learning", "training"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch",
  "webdataset",
  "numpy",
  "scipy",
  "healpy",
  "scikit-learn",
  "h5py",
  "pyyaml",
  "wandb",
  "cuHPX",
  "torch-harmonics @ git+https://github.com/NVIDIA/torch-harmonics.git",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "ipython",
  "jupyter",
  "matplotlib",
]

[project.scripts]
euclid-deeplss-training = "euclid_multiprobe_deeplss_training.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/euclid_multiprobe_deeplss_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
pythonpath = ["src"]

[tool.ruff]
line-length = 149
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
